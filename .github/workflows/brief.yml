name: Brief Matinal Sénégal

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparer-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Générer le bulletin
        run: python brief.py
      - name: Enregistrer le bulletin dans GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bulletin.txt
          git diff --cached --quiet || (git commit -m "Mise à jour du bulletin quotidien" && git push)
